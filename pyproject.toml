[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvformfiller"
version = "1.0.0"
description = "Herramienta para rellenar automáticamente formularios PDF de solicitudes de empleo a partir de un CV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danny-Developer2" }]
keywords = ["cv", "formulario", "pdf", "acroform", "rellenar", "empleo", "automatizacion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "pypdf>=5.0,<7",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4.30,<6",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "rich>=13.9,<14",
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.15",
]

[project.scripts]
cv-form-filler = "cvformfiller.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/cvformfiller/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pdfplumber.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
